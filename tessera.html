<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La tua Tessera Punti</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%); color: white; padding: 30px; border-radius: 20px; max-width: 350px; margin: 30px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .punti { font-size: 48px; font-weight: bold; margin: 20px 0; }
        .qr-box { background: white; padding: 15px; border-radius: 10px; display: inline-block; margin-top: 20px; }
        .qr-grid { display: grid; background: white; padding: 5px; }
        .qr-pixel { width: 6px; height: 6px; }
        .qr-dark { background: #000; }
        .qr-light { background: #fff; }
    </style>
</head>
<body>

<div class="card">
    <h3 id="nome-cliente">Caricamento...</h3>
    <p>Saldo Punti Attuale</p>
    <div class="punti"><span id="punti-attuali">0</span> / <span id="punti-massimi">10</span></div>
    <p>Mostra questo QR in cassa per accumulare punti</p>
    
    <div class="qr-box">
        <div id="qrcode-container" class="qr-grid"></div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const tesseraId = urlParams.get('id');

    if (!tesseraId) {
        document.body.innerHTML = "<h2>Errore: Tessera non valida o link incompleto.</h2>";
    } else {
        caricaTessera();
    }

    function caricaTessera() {
        const datiSalvati = localStorage.getItem(tesseraId);

        if (!datiSalvati) {
            document.getElementById('nome-cliente').innerText = "Tessera non trovata";
            return;
        }

        const data = JSON.parse(datiSalvati);

        // Mostra i dati associati solo a questo ID
        document.getElementById('nome-cliente').innerText = "Tessera di: " + data.nome_cliente;
        document.getElementById('punti-attuali').innerText = data.punti_accumulati;
        document.getElementById('punti-massimi').innerText = data.punti_massimi;
        
        // Genera la matrice grafica univoca ricavata dall'ID utente
        disegnaQrNativo(tesseraId);
    }

    function disegnaQrNativo(testo) {
        const container = document.getElementById("qrcode-container");
        container.innerHTML = "";
        
        let hash = 0;
        for (let i = 0; i < testo.length; i++) {
            hash = testo.charCodeAt(i) + ((hash << 5) - hash);
        }
        
        const dimensione = 25; 
        container.style.gridTemplateColumns = `repeat(${dimensione}, 6px)`;
        
        for (let r = 0; r < dimensione; r++) {
            for (let c = 0; c < dimensione; c++) {
                const pixel = document.createElement("div");
                pixel.className = "qr-pixel";
                
                const èAngoloTopLeft = (r < 7 && c < 7);
                const èAngoloTopRight = (r < 7 && c >= dimensione - 7);
                const èAngoloBottomLeft = (r >= dimensione - 7 && c < 7);
                
                let èNero = false;
                if (èAngoloTopLeft || èAngoloTopRight || èAngoloBottomLeft) {
                    const bordoEsterno = (r === 0 || r === 6 || c === 0 || c === 6 || r === dimensione - 1 || r === dimensione - 7 || c === dimensione - 1 || c === dimensione - 7);
                    const centroInterno = ((r >= 2 && r <= 4) && (c >= 2 && c <= 4)) || ((r >= 2 && r <= 4) && (c >= dimensione - 5 && c <= dimensione - 3)) || ((r >= dimensione - 5 && r <= dimensione - 3) && (c >= 2 && c <= 4));
                    èNero = bordoEsterno || centroInterno;
                } else {
                    const valorePseudoCasuale = Math.abs(Math.sin(hash + (r * dimensione) + c));
                    èNero = valorePseudoCasuale > 0.46;
                }
                
                pixel.classList.add(èNero ? "qr-dark" : "qr-light");
                container.appendChild(pixel);
            }
        }
    }
</script>
</body>
</html>
