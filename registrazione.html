<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiva la tua Fidelity Card</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Benvenuto! 🎉</h2>
    <p>Inserisci il tuo nome per ricevere subito la tua tessera punti digitale.</p>
    <input type="text" id="nome" placeholder="Il tuo Nome e Cognome" required>
    <button onclick="creaTessera()">Attiva la mia Tessera</button>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    // ASSICURATI che questa sia la chiave lunghissima presa da Settings > API (inizia per eyJ...)
    const SUPABASE_KEY = "sb_publishable_LCDVhGUKqEcSqhRVpJ8QWw_M1hOlO-A"; 

    async function creaTessera() {
        const nomeUtente = document.getElementById('nome').value;
        if (!nomeUtente) {
            alert("Per favore, inserisci il tuo nome!");
            return;
        }

        try {
            // Aggiungiamo la barra finale all'URL per evitare reindirizzamenti CORS bloccati
            const urlCompleto = `${SUPABASE_URL}/rest/v1/tessere`;
            
            const response = await fetch(urlCompleto, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=representation'
                },
                body: JSON.stringify({ nome_cliente: nomeUtente })
            });

            // Se il server risponde ma con un errore (es. 400, 401, 404)
            if (!response.ok) {
                const testoErrore = await response.text();
                alert(`Il server ha risposto con Errore ${response.status}: ${testoErrore}`);
                return;
            }

            const data = await response.json();

            if (data && data.length > 0) {
                const nuovoId = data[0].id; // Estraiamo l'id dal primo elemento dell'array restituito
                alert("Tessera creata con successo! ID: " + nuovoId);
                window.location.href = "tessera.html?id=" + nuovoId;
            } else {
                alert("Il database non ha restituito i dati della tessera creata.");
            }

        } catch (err) {
            // Questo scatta solo se c'è un blocco di rete totale o un crash del codice
            alert("Errore tecnico di rete.\n\nSe vedi questo messaggio, premi F12 sulla tastiera, vai nella scheda 'Console' e incollamici il testo rosso che trovi li dentro.");
        }
    }
</script>
</body>
</html>
