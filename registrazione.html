<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attiva la tua Fidelity Card</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 50px auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 95%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="box">
    <h2>Benvenuto! 🎉</h2>
    <p>Inserisci il tuo nome per ricevere subito la tua tessera punti digitale.</p>
    <input type="text" id="nome" placeholder="Il tuo Nome e Cognome" required>
    <button onclick="creaTessera()">Attiva la mia Tessera</button>
</div>

<script>
    function creaTessera() {
        const nomeUtente = document.getElementById('nome').value;
        if (!nomeUtente) {
            alert("Per favore, inserisci il tuo nome!");
            return;
        }

        // Generiamo un ID univoco e salviamo i dati nella memoria sicura del browser
        const nuovoId = "FID-" + Math.floor(100000 + Math.random() * 900000);
        
        const datiTessera = {
            id: nuovoId,
            nome_cliente: nomeUtente,
            punti_accumulati: 0,
            punti_massimi: 10
        };

        // Salvataggio locale
        localStorage.setItem(nuovoId, JSON.stringify(datiTessera));
        
        // Spostiamo il cliente direttamente sulla sua tessera senza chiamate di rete esterne bloccabili!
        window.location.href = "tessera.html?id=" + nuovoId;
    }
</script>
</body>
</html>
