<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pannello Cassa - Scanner</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        #reader { max-width: 400px; margin: 20px auto; background: white; padding: 10px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .form-cassa { background: white; padding: 25px; border-radius: 15px; max-width: 350px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
        input { width: 80%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 18px; text-align: center; }
        button { width: 85%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<h2>Scannerizza Tessera Cliente 🏪</h2>
<div id="reader"></div>

<div class="form-cassa" id="pannello-inserimento">
    <h3>Cliente Riconosciuto!</h3>
    <p>Nome: <strong id="nome-rilevato">...</strong></p>
    <p>Punti attuali: <strong id="punti-rilevati">0</strong></p>
    <input type="number" id="punti-da-aggiungere" placeholder="Punti da aggiungere (es. 1)" value="1">
    <br>
    <button onclick="salvaPunti()">Aggiungi e Aggiorna</button>
</div>

<script>
    // Configurazione corretta Supabase
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_LCDVhGUKqEcSqhRVpJ8QWw_M1hOlO-A";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let idClienteScansionato = "";
    let puntiAttualiCliente = 0;

    // Questa funzione scatta quando la fotocamera legge con successo il QR Code
    function onScanSuccess(decodedText) {
        idClienteScansionato = decodedText;
        // Ferma temporaneamente lo scanner per non duplicare le letture
        html5QrcodeScanner.clear().then(() => {
            recuperaDatiCliente(idClienteScansionato);
        }).catch(err => {
            recuperaDatiCliente(idClienteScansionato);
        });
    }

    async function recuperaDatiCliente(id) {
        try {
            const { data, error } = await supabaseClient
                .from('tessere')
                .select('*')
                .eq('id', id)
                .single();

            if (error || !data) {
                alert("QR Code non associato a nessuna tessera valida.");
                riavviaScanner();
            } else {
                puntiAttualiCliente = data.punti_accumulati;
                document.getElementById('nome-rilevato').innerText = data.nome_cliente;
                document.getElementById('punti-rilevati').innerText = puntiAttualiCliente;
                document.getElementById('pannello-inserimento').style.display = "block";
            }
        } catch (err) {
            alert("Errore nel recupero del cliente: " + err.message);
            riavviaScanner();
        }
    }

    async function salvaPunti() {
        const puntiAggiuntivi = parseInt(document.getElementById('punti-da-aggiungere').value) || 0;
        const nuoviPunti = puntiAttualiCliente + puntiAggiuntivi;

        try {
            const { error } = await supabaseClient
                .from('tessere')
                .update({ punti_accumulati: nuoviPunti })
                .eq('id', idClienteScansionato);

            if (error) {
                alert("Errore durante l'aggiornamento dei punti su Supabase: " + error.message);
            } else {
                alert("Punti aggiornati con successo!");
                document.getElementById('pannello-inserimento').style.display = "none";
                document.getElementById('punti-da-aggiungere').value = "1";
                // Riavvia la fotocamera per il cliente successivo
                riavviaScanner();
            }
        } catch (err) {
            alert("Errore di rete: " + err.message);
        }
    }

    let html5QrcodeScanner;
    function riavviaScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    }

    // Avvio iniziale dello scanner appena si apre la pagina
    riavviaScanner();
</script>
</body>
</html>
